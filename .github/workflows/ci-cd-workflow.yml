name: Visionary Image JS CI — Build and test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run types:validate
      - run: pnpm test
